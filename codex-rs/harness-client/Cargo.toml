[package]
name = "codex-harness-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "codex_harness_client"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
codex-exec-server-protocol = { workspace = true }
serde = { workspace = true, features = ["derive"] }
